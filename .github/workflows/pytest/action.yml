name: Run pytest suite
description: Install the pinned test environment and run the full suite

inputs:
  python-version:
    description: Python version used by uv
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"
        enable-cache: false

    # uv defaults to ~/Library/Caches/uv on macOS; pin one location on both
    # platforms so the cache step below keys the same way.
    - name: Set uv cache location
      shell: bash
      run: echo "UV_CACHE_DIR=$HOME/.cache/uv" >> "$GITHUB_ENV"

    - name: Cache uv downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ inputs.python-version != '' && format('py{0}-', inputs.python-version) || '' }}${{ hashFiles('uv.lock') }}
        restore-keys: uv-${{ runner.os }}-${{ inputs.python-version != '' && format('py{0}-', inputs.python-version) || '' }}

    # --frozen pins the resolution to uv.lock so a transitive bump cannot
    # turn main red without a lockfile change in the diff.
    # Bound worker count on both runners and rebalance uneven test durations.
    # Report slow tests so future bottlenecks are visible in the CI logs.
    - name: Run the suite
      shell: bash
      env:
        ZETA_TEST_EXIT_WATCHDOG_SECONDS: "90"
      run: |
        # DIAG ONLY: after 11 min, dump every process tree and every python stack.
        pip install --quiet py-spy || true
        (
          sleep 600
          for round in 1 2; do
            echo "=== DIAG round $round $(date -u +%T) ==="
            ps -eo pid,ppid,pgid,sid,stat,wchan:32,etime,args --forest | grep -v ' ps -eo'
            for pid in $(pgrep -f 'exec\(eval') $(pgrep -f 'bin/pytest -q'); do
              echo "--- DIAG pid $pid stat=$(cut -d' ' -f3 /proc/$pid/stat 2>/dev/null) ---"
              tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null; echo
              for t in /proc/$pid/task/*; do echo "task ${t##*/} $(cat $t/comm) wchan=$(cat $t/wchan 2>/dev/null) state=$(cut -d' ' -f3 $t/stat)"; done
              sudo ls -l /proc/$pid/fd 2>/dev/null | head -60
              sudo timeout 60 env "PATH=$PATH" py-spy dump --locals --pid $pid 2>&1 | head -400
              echo "--- DIAG children of $pid ---"
              for c in $(pgrep -P $pid); do tr '\0' ' ' < /proc/$c/cmdline; echo; sudo timeout 30 env "PATH=$PATH" py-spy dump --pid $c 2>&1 | head -60; done
            done
            sleep 60
          done
          echo "=== DIAG killing pytest ==="
          pkill -f 'pytest -q -n 4' || true
        ) &
        uv run ${{ inputs.python-version != '' && format('--python "{0}" ', inputs.python-version) || '' }}--frozen pytest -q -n 4 --dist worksteal --durations=25
