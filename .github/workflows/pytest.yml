name: Pytest

on:
  workflow_call:
    inputs:
      os:
        description: GitHub-hosted runner label
        required: true
        type: string

jobs:
  test:
    name: pytest (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      # uv defaults to ~/Library/Caches/uv on macOS; pin one location on both
      # platforms so the cache step below keys the same way.
      - name: Set uv cache location
        run: echo "UV_CACHE_DIR=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      # --frozen pins the resolution to uv.lock so a transitive bump cannot
      # turn main red without a lockfile change in the diff.
      # Bound worker count on both runners and rebalance uneven test durations.
      # Report slow tests so future bottlenecks are visible in the CI logs.
      - name: Run the suite
        run: uv run --frozen pytest -q -n 4 --dist worksteal --durations=25
