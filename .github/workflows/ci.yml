name: CI

# Runs on pull requests AND on every push to main. The post-merge run on main
# is the important half: ZETA-51 and ZETA-52 were both red-main incidents where
# two pull requests were green independently and only collided once merged, so
# a pull-request check alone would not have caught either one.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Every main commit needs an Ubuntu, ruff, and browser result; superseded
  # pull-request runs do not.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: pytest (${{ matrix.os }}${{ matrix.python-version != '3.12' && format(', py{0}', matrix.python-version) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'macos')) && '[{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"macos-latest","python-version":"3.12"}]' || '[{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.14"}]') }}
    # Main keeps one running macOS job and only the newest pending commit.
    # Other matrix jobs use a unique group and cannot replace it.
    concurrency:
      group: ${{ (github.event_name == 'push' && matrix.os == 'macos-latest') && 'ci-macos-main' || format('ci-{0}-{1}-{2}-{3}', github.workflow, github.sha, matrix.os, matrix.python-version) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/pytest
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/workflows/pytest
        if: matrix.os == 'macos-latest'

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      # ruff is pinned through uv.lock (it is in the dev dependency group) and
      # the violations that predate this job are grandfathered per file and
      # rule in pyproject.toml's per-file-ignores, so this fails only on NEW
      # violations. Fix a file to delete its entry; never add to that list in
      # a feature PR. --output-format github annotates the offending lines in
      # the pull request.
      - name: Run ruff
        run: uv run --frozen ruff check --output-format github

      - name: Reject new low-signal test patterns
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          base=$(python scripts/lint_test_quality.py --base "$GITHUB_EVENT_NAME" "$GITHUB_BASE_REF")
          git diff --unified=0 "$base" HEAD -- ':(glob)**/*.py' | python scripts/lint_test_quality.py -

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Run Gamma browser-client protocol tests
        run: uv run --frozen pytest -q tests/test_server_gamma.py

  fresh-old-home:
    name: fresh zeta on old home (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Start installed zeta on old home
        run: python scripts/smoke_old_home.py
      - name: Select stored-format predecessor
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/storage_format_compatibility.py
      - name: Emit candidate stored-format registry
        run: python tests/compatibility/storage_probe.py > storage-format-candidate.json
      - name: Archive candidate registry and lock
        uses: actions/upload-artifact@v4
        with:
          name: storage-format-${{ matrix.os }}-${{ github.sha }}
          path: |
            storage-format-candidate.json
            uv.lock

  merge-resolution:
    name: merge resolution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check merge resolutions
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          body_file=""
          cleanup() { [ -z "$body_file" ] || rm -f "$body_file"; }
          trap cleanup EXIT
          if [ "$EVENT_NAME" = pull_request ]; then
            body_file=$(mktemp)
            printf '%s' "$PR_BODY" > "$body_file"
            base="$BASE_SHA"
            head="$HEAD_SHA"
            commits=$(git rev-list --merges "$base..$head")
            if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
              commits="$commits $(git rev-parse HEAD)"
            fi
          else
            commits="$(git rev-parse HEAD)"
            subject=$(git log -1 --format=%s)
            pr_number=$(printf '%s\n' "$subject" | sed -nE 's/^Merge pull request #([0-9]+).*/\1/p')
            if [ -n "$pr_number" ] && body_file=$(mktemp) && gh pr view "$pr_number" --json body -q .body > "$body_file"; then
              :
            else
              [ -z "$body_file" ] || rm -f "$body_file"
              body_file=""
              echo "::notice title=merge resolution::PR explanations were not loaded"
            fi
          fi
          commits=$(printf '%s\n' "$commits" | sed '/^$/d' | sort -u)
          failed=0
          for commit in $commits; do
            echo "checking merge resolution: $commit"
            args=("$commit")
            [ -z "$body_file" ] || args+=(--pr-body-file "$body_file")
            set +e
            output=$(python scripts/check_merge_resolution.py "${args[@]}" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              continue
            fi
            if [ "$status" -eq 2 ] && printf '%s\n' "$output" | grep -q 'cannot identify exactly one main parent'; then
              echo "::warning title=merge resolution::skipping $commit because the main parent is ambiguous"
              continue
            fi
            echo "::error title=merge resolution::$commit failed (exit $status)"
            failed=1
          done
          exit "$failed"
