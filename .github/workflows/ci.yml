name: CI

# Runs on pull requests AND on every push to main. The post-merge run on main
# is the important half: ZETA-51 and ZETA-52 were both red-main incidents where
# two pull requests were green independently and only collided once merged, so
# a pull-request check alone would not have caught either one.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are disposable; main runs are the record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One platform failing must still report the other; a darwin-only
      # regression is exactly what the second runner is for (ZETA-90).
      fail-fast: false
      # ZETA-84 was a Linux-only bug that darwin-only testing could not see.
      # The mirror-image gap is just as real: the F_GETPATH sandbox branch and
      # the clipboard paste path only run on darwin, so both platforms run.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # tmux is deliberately NOT installed, so the three tmux-gated tests in
      # tests/test_tui.py and tests/test_test_environment.py take their
      # existing skipif path. Installing it makes them run, and
      # test_teardown_guard_rejects_tmux_pane_without_home then races: the
      # pane's `sh -c` finishes, the session ends, the server exits because
      # nothing is left attached, and the parent's `wait-for` exits 1 against
      # a dead socket. That is a test-side timing assumption of the ZETA-67
      # family, not product behaviour. ZETA-85 covers making them CI-capable;
      # until then this is a known coverage gap, not a pass.
      # ubuntu-latest SHIPS tmux, so the skip assumption above does not hold
      # on a stock runner — remove it explicitly or the racy tests run anyway
      # (first hit: PR #111 run 33993051287). macos-latest does not ship it,
      # so the step is a no-op there; the guard keeps it platform-neutral.
      - name: Remove tmux so tmux-gated tests skip
        run: |
          if command -v tmux >/dev/null 2>&1; then
            sudo apt-get remove -y tmux 2>/dev/null || sudo rm -f "$(command -v tmux)"
          fi

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # uv defaults to ~/Library/Caches/uv on macOS; pin one location on
          # both platforms so the cache step below keys the same way.
          echo "UV_CACHE_DIR=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      # --frozen pins the resolution to uv.lock so a transitive bump cannot
      # turn main red without a lockfile change in the diff.
      - name: Run the suite
        run: uv run --frozen pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ruff is pinned through uv.lock (it is in the dev dependency group) and
      # the violations that predate this job are grandfathered per file and
      # rule in pyproject.toml's per-file-ignores, so this fails only on NEW
      # violations. Fix a file to delete its entry; never add to that list in
      # a feature PR. --output-format github annotates the offending lines in
      # the pull request.
      - name: Run ruff
        run: uv run --frozen ruff check --output-format github

  gui-paths:
    name: detect gui changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.gui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gui:
              - 'gui/**'

  cargo:
    name: cargo (macos-latest)
    needs: gui-paths
    if: needs.gui-paths.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
