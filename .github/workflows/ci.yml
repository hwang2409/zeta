name: CI

# Runs on pull requests AND on every push to main. The post-merge run on main
# is the important half: ZETA-51 and ZETA-52 were both red-main incidents where
# two pull requests were green independently and only collided once merged, so
# a pull-request check alone would not have caught either one.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  # Every main commit needs a result; superseded pull-request runs do not.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  pytest:
    name: pytest
    uses: ./.github/workflows/pytest.yml
    with:
      # ZETA-84 was a Linux-only bug that darwin-only testing could not see.
      # Pull requests opt into macOS with the macos label; main always runs both.
      os: ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'macos')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]' }}

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      # ruff is pinned through uv.lock (it is in the dev dependency group) and
      # the violations that predate this job are grandfathered per file and
      # rule in pyproject.toml's per-file-ignores, so this fails only on NEW
      # violations. Fix a file to delete its entry; never add to that list in
      # a feature PR. --output-format github annotates the offending lines in
      # the pull request.
      - name: Run ruff
        run: uv run --frozen ruff check --output-format github

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Run Gamma browser-client protocol tests
        run: uv run --frozen pytest -q tests/test_server_gamma.py
