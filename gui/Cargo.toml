[package]
name = "zeta-gui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
gpui-kit = { version = "0.6", features = ["tree-sitter-rust", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-typescript"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[profile.release]
strip = "symbols"

[features]
default = ["gui"]
gui = ["dep:gpui-kit", "dep:image"]
# Compatibility alias: GPUI Kit always enables runtime shaders.
runtime-shaders = []
# Native, real-socket smoke driver and renderer capture; excluded from normal builds.
smoke-test = ["gui", "gpui-kit/test-support"]

[[bin]]
name = "zeta-gui"
path = "src/main.rs"
required-features = ["gui"]

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }

# ZETA-129: temporary fork of gpui-base 0.6.1 with two authorised edits
# in `InlineFlow::prepaint` — the functional `MaxContent` swap on the
# width axis, and a `#[cfg]`-gated recorder probe used by the native
# mutation arm (see `vendor/gpui-base/src/text/inline_flow.rs` and
# `vendor/README.md`). Unfork when a Kit release ships the fix.
#
# ZETA-133-D3: temporary fork of gpui-component 0.6.1 with ONE authorised
# edit in `src/message_scroller.rs` — a `new_with_alignment` seam so the
# transcript can request `ListAlignment::Bottom` (the scroll core's
# supported chat-UI mode) for short-transcript bottom anchoring. Unfork
# when upstream exposes alignment on `MessageScrollerState`.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
