[package]
name = "zeta-gui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
gpui-kit = { version = "0.6", features = ["tree-sitter-rust", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-typescript"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[features]
default = ["gui"]
gui = ["dep:gpui-kit", "dep:image"]
# Compatibility alias: GPUI Kit always enables runtime shaders.
runtime-shaders = []
# Native, real-socket smoke driver and renderer capture; excluded from normal builds.
smoke-test = ["gui", "gpui-kit/test-support"]

[[bin]]
name = "zeta-gui"
path = "src/main.rs"
required-features = ["gui"]

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
