[package]
name = "zeta-gui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "20d3cd1d7981ed2076be5b72c817a1febbba3cb9", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "20d3cd1d7981ed2076be5b72c817a1febbba3cb9", features = ["font-kit", "wayland", "x11"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui_platform"]
# This feature is useful on hosts without Apple's offline Metal compiler.
# Release builds keep GPUI's default precompiled shader path.
runtime-shaders = ["gpui_platform/runtime_shaders"]

[[bin]]
name = "zeta-gui"
path = "src/main.rs"
required-features = ["gui"]

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "20d3cd1d7981ed2076be5b72c817a1febbba3cb9", features = ["test-support"] }
