    { name = "httpx" },
    { name = "markdown-it-py" },
    { name = "mdit-py-plugins" },
    { name = "pillow" },
    { name = "prompt-toolkit" },
    { name = "pyvips", extra = ["binary"] },
    { name = "pyyaml" },
    { name = "rich" },
]

