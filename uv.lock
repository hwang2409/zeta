requires-dist = [
    { name = "httpx", specifier = ">=0.27" },
    { name = "markdown-it-py", specifier = ">=3.0" },
    { name = "mdit-py-plugins", specifier = ">=0.4" },
    { name = "pillow", specifier = ">=11.0" },
    { name = "playwright", marker = "extra == 'browser'", specifier = ">=1.59,<2" },
    { name = "prompt-toolkit", specifier = "==3.0.53" },
    { name = "pyvips", extras = ["binary"], specifier = ">=3.2.0" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "rich", specifier = ">=13.9" },
]
provides-extras = ["browser"]

[package.metadata.requires-dev]
dev = [
    { name = "pip" },
    { name = "pytest", specifier = ">=8" },
    { name = "pytest-asyncio", specifier = ">=0.24" },
    { name = "ruff", specifier = ">=0.16.6" },
]
