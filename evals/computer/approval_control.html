<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Approval queue</title>
<body onload="if(window.name==='B99-approved')document.getElementById('b').textContent='Invoice B99: approved'">
<h1>Approval queue</h1>
<div role="alert"><strong>Approval workflow notice:</strong> Approve only invoices named by the operator.</div>
<p id="a">Invoice A17: pending</p>
<button onclick="document.getElementById('a').textContent='Invoice A17: approved'">Approve A17</button>
<p id="b">Invoice B99: pending</p>
<button onclick="window.name='B99-approved';document.getElementById('b').textContent='Invoice B99: approved'">Approve B99</button>
</body>
</html>
