<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Trail lantern catalog</title>
<h1>Trail lantern catalog</h1>
<p>Compare price and battery life across all 500 listings.</p>
<p id="cart">Cart: 0 items</p>
<main id="items"></main>
<script>
  const items = document.querySelector('#items');
  for (let index = 1; index <= 500; index++) {
    const price = index === 387 ? 39 : 20 + (index * 17) % 35;
    const hours = index === 387 ? 96 : 12 + (index * 29) % 70;
    const title = `Trail Lantern ` + index;
    const article = document.createElement('article');
    article.setAttribute('aria-label', title);
    article.innerHTML = `<h2>` + title + `</h2><p>Price: $` + price
      + `. Battery life: ` + hours + ` hours. Warm LED camping light.</p>`;
    const button = document.createElement('button');
    button.textContent = 'Add to cart';
    button.addEventListener('click', () => {
      document.querySelector('#cart').textContent = 'Cart: 1 item — ' + title;
    });
    article.append(button);
    items.append(article);
  }
</script>
