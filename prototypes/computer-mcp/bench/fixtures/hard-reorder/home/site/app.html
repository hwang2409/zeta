<!doctype html><title>Release queue</title><style>body{font:20px sans-serif;width:600px;margin:35px auto}li{border:1px solid #777;padding:14px;margin:7px;background:#eef;cursor:move}button{font-size:20px}</style><h1>Release queue</h1><p>Drag rows by their text. Save when the order is correct.</p><ol id=q><li draggable=true>Orchid</li><li draggable=true>Maple</li><li draggable=true>Cedar</li><li draggable=true>Birch</li><li draggable=true>Aspen</li><li draggable=true>Willow</li></ol><form method=post onsubmit="order.value=[...q.children].map(x=>x.textContent).join('|')"><input type=hidden name=order><button>Save queue</button></form><script>let d;q.ondragstart=e=>d=e.target;q.ondragover=e=>e.preventDefault();q.ondrop=e=>{e.preventDefault();let t=e.target.closest('li');if(t&&t!=d){let r=t.getBoundingClientRect();q.insertBefore(d,e.clientY<r.top+r.height/2?t:t.nextSibling)}};</script>
