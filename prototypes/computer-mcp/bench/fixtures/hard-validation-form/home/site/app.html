<!doctype html><title>Access request</title><style>body{font:19px sans-serif;max-width:700px;margin:30px auto}label{display:block;margin:15px}input,select,button{font-size:19px}.hint{color:#555}</style><h1>Secure lab access</h1><form method=post><label>Employee name <input name=name required></label><label>Badge ID <input name=badge required pattern="[A-Z]{2}-[0-9]{4}" title="two uppercase letters, a hyphen, and four digits"></label><label>Work email <input name=email type=email required></label><label>Access zone <select name=zone required><option value="">Choose...</option><option>Clean Room</option><option>Cold Storage</option><option>Optics Bay</option></select></label><label>Start date <input name=start type=date min="2026-11-01" required></label><label>Reason <input name=reason minlength=12 required></label><p class=hint>All fields use strict validation. The browser explains invalid values.</p><button>Submit request</button></form>
