[project]
name = "zeta"
version = "0.1.0"
description = "zeta: custom agent harness: own loop, plan-authenticated provider backends"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
