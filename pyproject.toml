[project]
name = "zeta"
version = "0.1.0"
description = "zeta: custom agent harness: own loop, plan-authenticated provider backends"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0.48",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
zeta = "zeta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zeta"]

[tool.hatch.build.targets.wheel.force-include]
"src/zeta/prompts/identity.md" = "zeta/prompts/identity.md"
"src/zeta/skills/review.md" = "zeta/skills/review.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
