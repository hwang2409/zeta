[project]
name = "zeta"
version = "0.1.0"
description = "zeta: custom agent harness: own loop, plan-authenticated provider backends"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "prompt_toolkit>=3.0.48",
    "pyyaml>=6.0",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pip",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
zeta = "zeta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zeta"]

[tool.hatch.build.targets.wheel.force-include]
"src/zeta/prompts/identity.md" = "zeta/prompts/identity.md"
"src/zeta/skills/review.md" = "zeta/skills/review.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "environment_sensitive: test behavior that depends on terminal environment",
]

[tool.ruff.lint.per-file-ignores]
# Baseline recorded 2026-09-07 (ZETA-90): violations that predate the CI lint
# job, grandfathered per file and rule so the job fails only on new ones. Fix
# a file's violations to delete its entry; never add to this list in a feature
# PR. RUF100 appears where grandfathering a rule makes a file's existing
# `# noqa` directives for it look unused.
